# CI des pull requests : manifestes, paquets TypeScript, UI et archives des plugins, serveurs Rust
# sur Linux seulement, pour économiser les minutes GitHub Actions (macOS compte 10×, Windows 2×) :
# les quatre cibles de l'archive restent construites par release.yml, à chaque nouvelle version.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Manifestes et skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # comparaison des versions avec la branche cible
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Valider les plugins (version incrémentée si modifiés)
        if: github.event_name == 'pull_request'
        run: pnpm validate --base origin/${{ github.base_ref }}
      - name: Valider les plugins
        if: github.event_name != 'pull_request'
        run: pnpm validate

  typescript:
    name: SDK, kit UI, écrans et archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build des UI de plugins
        run: pnpm build
      # Même assemblage que la release, sans les binaires (construits par le job rust).
      - name: Assembler chaque plugin
        run: |
          set -euo pipefail
          for manifest in plugins/*/plugin.toml; do
            pnpm package "$(basename "$(dirname "$manifest")")" --allow-missing-targets --out out
          done
          ls -la out

  rust:
    name: Serveurs ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # Linux seulement ici ; release.yml construit les quatre cibles de scripts/lib/targets.ts
        # (vérifié par scripts/lib/scripts.test.ts).
        include:
          - target: linux-x86_64
            rust: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04 # glibc 2.35 : comme la release, pour les distributions plus anciennes
            test: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # L'image du runner fait partie de la clé : des objets C compilés sur une glibc plus
          # récente (ubuntu-latest) ne se lient pas sur ubuntu-22.04 (`__isoc23_sscanf`).
          key: ${{ matrix.target }}-${{ matrix.runner }}
      - name: Format
        if: matrix.target == 'linux-x86_64'
        run: cargo fmt --all --check
      - name: Tests
        if: matrix.test
        run: cargo test --workspace --locked --target ${{ matrix.rust }}
      - name: Build des serveurs
        run: cargo build --workspace --bins --locked --target ${{ matrix.rust }}
