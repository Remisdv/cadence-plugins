[package]
name = "cadence-exemple"
version = "0.1.0"
description = "Serveur MCP du plugin Cadence « Exemple » : plugin de référence pour les auteurs (compteur)."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# Le nom du binaire est celui du paquet : `[server] bin = "cadence-exemple"` dans plugin.toml.

[dependencies]
rmcp.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
# Délais du test de bout en bout (session MCP en mémoire).
tokio = { workspace = true, features = ["time", "io-util"] }
