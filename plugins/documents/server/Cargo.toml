[package]
name = "cadence-documents"
version = "0.4.0"
description = "Serveur MCP du plugin Cadence « Documents » (cours PDF, Word, PowerPoint, Markdown ; entraînement)."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rmcp.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
cadence-extract.workspace = true

[dev-dependencies]
cadence-extract = { workspace = true, features = ["test-support"] }
tempfile = "3"
# Délais du test de bout en bout (session MCP en mémoire).
tokio = { workspace = true, features = ["time", "io-util"] }
