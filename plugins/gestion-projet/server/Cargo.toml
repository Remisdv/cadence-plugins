[package]
name = "cadence-gestion-projet"
version = "0.9.0"
description = "Serveur MCP du plugin Cadence « Gestion de projet » (issues, sprints, versions, PR GitHub)."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rmcp.workspace = true
tokio = { workspace = true, features = ["time"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow.workspace = true
base64 = "0.23"
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2"] }
cadence-extract.workspace = true
calamine = "0.30"
csv = "1"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
cadence-extract = { workspace = true, features = ["test-support"] }
# Faux GitHub des tests (serveur HTTP local).
tokio = { workspace = true, features = ["net", "io-util"] }
