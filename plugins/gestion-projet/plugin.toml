api = 1
id = "gestion-projet"
name = "Gestion de projet"
version = "0.4.0"
description = "Issues GitHub, kanban, roadmap, sprints, versions et pull requests de vos dépôts suivis, avec des skills pour compléter, implémenter et livrer."
authors = ["Rémi Lhuillier"]
icon = "icon.svg"
category = "projet"
color = "blue"
# Connexion GitHub, dépôts suivis, sélecteur de dépôt, clone et worktree à la demande : fournis par Cadence.
# Le service déclare lui-même ses outils externes (git requis, gh optionnel et connecté) : pas de [[requires]].
services = ["repos"]
min_cadence = "0.3.0"

[server]
bin = "cadence-gestion-projet"

[ui]
entry = "ui/index.html"

[[ui.views]]
id = "sprint"
title = "Sprint en cours"
icon = "sprint"
section = "Pilotage"

[[ui.views]]
id = "issues"
title = "Issues"
icon = "issue"
section = "Pilotage"

[[ui.views]]
id = "roadmap"
title = "Roadmap"
icon = "roadmap"
section = "Planification"

[[ui.views]]
id = "planning"
title = "Planning"
icon = "calendar"
section = "Planification"

[[ui.views]]
id = "versions"
title = "Versions"
icon = "tag"
section = "Planification"

[[ui.views]]
id = "architecture"
title = "Architecture"
icon = "folder"
section = "Conception"

[[ui.views]]
id = "designs"
title = "Designs"
icon = "layers"
section = "Conception"

[[ui.views]]
id = "pull-requests"
title = "Pull requests"
icon = "pullRequest"
section = "Code"

# Après la connexion GitHub du service repos (étape gérée par Cadence) : choix des dépôts suivis.
[[setup]]
id = "depots"
title = "Dépôts suivis"
view = "setup-depots"

[settings]
schema = "settings.schema.json"

# Boutons liés aux skills (ex-agents CTO, développeur, CEO et déploiement). Le contexte porte
# toujours le dépôt concerné : { "repo": "owner/name", "issue": 42 } ou { "repo", "version" }.

[[actions]]
id = "extraire-issues"
label = "Créer des issues depuis un document"
skill = "extraire-issues"
mode = "chat"

[[actions]]
id = "importer-design"
label = "Importer un design"
skill = "importer-design"
mode = "chat"
context = "design"

[[actions]]
id = "adapter-architecture"
label = "Adapter le code à l'architecture"
skill = "adapter-architecture"
mode = "chat"

[[actions]]
id = "planifier"
label = "Planifier avec l'IA"
skill = "planifier"
mode = "chat"

[[actions]]
id = "completer-issue"
label = "Compléter l'issue"
skill = "completer-issue"
mode = "chat"
context = "issue"

[[actions]]
id = "decouper-issue"
label = "Découper l'issue"
skill = "decouper-issue"
mode = "chat"
context = "issue"

[[actions]]
id = "implementer-issue"
label = "Implémenter"
skill = "implementer-issue"
mode = "background"
context = "issue"

[[actions]]
id = "proposer-issues"
label = "Proposer des issues"
skill = "proposer-issues"
mode = "chat"
context = "jalon"

[[actions]]
id = "preparer-release"
label = "Préparer la release"
skill = "preparer-release"
mode = "background"
context = "version"
