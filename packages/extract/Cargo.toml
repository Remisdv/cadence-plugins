[package]
name = "cadence-extract"
version = "0.1.0"
description = "Extraction du texte des documents (PDF, Word, PowerPoint, Markdown, texte), page par page, partagée par les plugins Documents et Gestion de projet."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Fabrique de fichiers de test (PDF, docx, pptx) pour les tests des plugins.
test-support = []

[dependencies]
serde.workspace = true
schemars.workspace = true
anyhow.workspace = true
pdf-extract = "0.12.1"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42.0"
